<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Kabuto Esports Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎮 KABUTO ESPORTS - Admin Panel</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="fas fa-user-shield"></i>
                    <span id="adminName">Admin</span>
                    <small class="ms-2 badge bg-light text-dark" id="adminRole">Super</small>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="users.html">
                            <i class="fas fa-users"></i> Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tournaments.html">
                            <i class="fas fa-trophy"></i> Tournaments
                        </a>
                    </li>
                    <!-- Inbox -->
                    <li class="nav-item">
                        <a class="nav-link" href="inbox.html">
                            <i class="fas fa-inbox"></i> Inbox
                        </a>
                    </li>

                    <!-- ✅ Added Notifications Menu -->
                    <li class="nav-item">
                        <a class="nav-link" href="notifications.html">
                            <i class="fas fa-bell"></i> Notifications
                        </a>
                    </li>

                    <li class="nav-item" id="adminsLink">
                        <a class="nav-link" href="admins.html">
                            <i class="fas fa-user-shield"></i> Admins
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>👥 User Management</h2>
                    <div class="d-flex gap-2">
                        <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search users..."
                            style="width: 300px;">
                        <button class="btn btn-primary" onclick="loadUsers()">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="card table-card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Tournaments</th>
                                    <th>Joined</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <tr>
                                        <td colspan="9" class="text-center py-4">
                                            <div class="spinner-border text-primary" role="status"></div>
                                            <p class="mt-2 text-muted">Loading users...</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div>
                                <small class="text-muted">Showing <strong id="showingCount">0</strong> of <strong
                                        id="totalCount">0</strong> users</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-outline-primary" id="prevBtn" onclick="previousPage()"
                                    disabled>
                                    <i class="fas fa-chevron-left"></i> Previous
                                </button>
                                <button class="btn btn-sm btn-outline-primary" id="nextBtn" onclick="nextPage()">
                                    Next <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User Details Modal -->
    <div class="modal fade" id="userDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">👤 User Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="userDetailsContent">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script>
        const API_URL = 'http://139.59.1.29:3000';
        let adminToken = localStorage.getItem('admin_token');
        let adminData = JSON.parse(localStorage.getItem('admin_data') || '{}');
        let currentPage = 0;
        let limit = 50;
        let totalUsers = 0;

        // Check if logged in
        if (!adminToken) {
            window.location.href = 'login.html';
        }

        // Display admin info
        document.getElementById('adminName').textContent = adminData.username || 'Admin';
        document.getElementById('adminRole').textContent = adminData.admin_role === 'super' ? 'Super Admin' : 'Secondary Admin';

        // Hide super admin only features
        if (adminData.admin_role !== 'super') {
            document.getElementById('adminsLink').style.display = 'none';
        }

        // Logout
        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_data');
            window.location.href = 'login.html';
        }

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentPage = 0;
                loadUsers();
            }
        });

        // Load Users
        async function loadUsers() {
            try {
                const search = document.getElementById('searchInput').value;
                const offset = currentPage * limit;

                const response = await fetch(`${API_URL}/admin/users?search=${search}&limit=${limit}&offset=${offset}`, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    totalUsers = data.total;
                    displayUsers(data.data);
                    updatePagination();
                } else {
                    alert('Error loading users');
                }

            } catch (error) {
                console.error('Load users error:', error);
                alert('Failed to load users');
            }
        }

        // Display Users
        function displayUsers(users) {
            const tbody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center py-4 text-muted">
                            No users found
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>#${user.user_id}</td>
                    <td><strong>${user.username}</strong></td>
                    <td>${user.full_name || '-'}</td>
                    <td>${user.email || '-'}</td>
                    <td>${user.phone_number || '-'}</td>
                    <td><span class="badge bg-info">${user.total_registrations}</span></td>
                    <td>${new Date(user.created_at).toLocaleDateString()}</td>
                    <td>
                        ${user.is_active
                    ? '<span class="badge bg-success">Active</span>'
                    : '<span class="badge bg-danger">Blocked</span>'}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="viewUserDetails(${user.user_id})">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm ${user.is_active ? 'btn-danger' : 'btn-success'}" 
                                onclick="toggleUserStatus(${user.user_id}, ${user.is_active})">
                            <i class="fas fa-${user.is_active ? 'ban' : 'check'}"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Update Pagination
        function updatePagination() {
            const showing = Math.min((currentPage + 1) * limit, totalUsers);
            document.getElementById('showingCount').textContent = showing;
            document.getElementById('totalCount').textContent = totalUsers;

            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = showing >= totalUsers;
        }

        // Pagination
        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                loadUsers();
            }
        }

        function nextPage() {
            if ((currentPage + 1) * limit < totalUsers) {
                currentPage++;
                loadUsers();
            }
        }

        // View User Details
        async function viewUserDetails(userId) {
            const modal = new bootstrap.Modal(document.getElementById('userDetailsModal'));
            modal.show();

            document.getElementById('userDetailsContent').innerHTML = `
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}/admin/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    const user = data.data.user;
                    const tournaments = data.data.tournaments;
                    const transactions = data.data.transactions;

                    document.getElementById('userDetailsContent').innerHTML = `
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <strong>Username:</strong> ${user.username}
                            </div>
                            <div class="col-md-6 mb-3">
                                <strong>Full Name:</strong> ${user.full_name || '-'}
                            </div>
                            <div class="col-md-6 mb-3">
                                <strong>Email:</strong> ${user.email || '-'}
                            </div>
                            <div class="col-md-6 mb-3">
                                <strong>Phone:</strong> ${user.phone_number || '-'}
                            </div>
                            <div class="col-md-6 mb-3">
                                <strong>Status:</strong> ${user.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-danger">Blocked</span>'}
                            </div>
                        </div>

                        <hr>

                        <h6 class="mb-3">🎮 Tournament Registrations (${tournaments.length})</h6>
                        ${tournaments.length > 0 ? `
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Tournament</th>
                                            <th>Type</th>
                                            <th>Fee</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${tournaments.map(t => `
                                            <tr>
                                                <td>${t.tournament_name}</td>
                                                <td>${t.registration_type}</td>
                                                <td>₹${t.registration_fee_paid}</td>
                                                <td><span class="badge bg-${t.registration_status === 'confirmed' ? 'success' : 'warning'}">${t.registration_status}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : '<p class="text-muted">No tournament registrations</p>'}
                    `;
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('userDetailsContent').innerHTML = `
                    <div class="alert alert-danger">Error loading user details</div>
                `;
            }
        }

        // Toggle User Status (Block/Unblock)
        async function toggleUserStatus(userId, currentStatus) {
            const action = currentStatus ? 'block' : 'activate';

            if (!confirm(`Are you sure you want to ${action} this user?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/users/${userId}/toggle-active`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert(`User ${action}ed successfully!`);
                    loadUsers();
                } else {
                    alert('Error: ' + data.message);
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update user status');
            }
        }



        // Load users on page load
        loadUsers();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
