<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Kabuto Esports Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎮 KABUTO ESPORTS - Admin Panel</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="fas fa-user-shield"></i>
                    <span id="adminName">Admin</span>
                    <small class="ms-2 badge bg-light text-dark" id="adminRole">Super</small>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="users.html">
                            <i class="fas fa-users"></i> Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tournaments.html">
                            <i class="fas fa-trophy"></i> Tournaments
                        </a>
                    </li>
                    <!-- Inbox -->
                    <li class="nav-item">
                        <a class="nav-link active" href="inbox.html">
                            <i class="fas fa-inbox"></i> Inbox
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="notifications.html">
                            <i class="fas fa-bell"></i> Notifications
                        </a>
                    </li>
                    <li class="nav-item" id="adminsLink">
                        <a class="nav-link" href="admins.html">
                            <i class="fas fa-user-shield"></i> Admins
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <h2 class="mb-4">📬 Admin Inbox</h2>

                <!-- Tabs -->
                <ul class="nav nav-tabs mb-4" id="inboxTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="compose-tab" data-bs-toggle="tab" data-bs-target="#compose"
                            type="button">
                            <i class="fas fa-edit"></i> Compose Message
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history"
                            type="button">
                            <i class="fas fa-history"></i> Message History
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content" id="inboxTabContent">

                    <!-- Compose Tab -->
                    <div class="tab-pane fade show active" id="compose">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0"><i class="fas fa-paper-plane"></i> Send Message</h5>
                            </div>
                            <div class="card-body">
                                <form id="composeForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Title *</label>
                                            <input type="text" class="form-control" id="messageTitle" required
                                                maxlength="100" placeholder="e.g., Tournament Room Details">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Send To *</label>
                                            <select class="form-select" id="sendTo" required>
                                                <option value="all">All Users</option>
                                                <option value="specific">Specific User</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3" id="userSelectDiv" style="display:none;">
                                        <label class="form-label">Select User *</label>
                                        <input type="text" class="form-control" id="userSearch"
                                            placeholder="Search by username or user ID...">
                                        <select class="form-select mt-2" id="userId" size="5">
                                            <option value="">Type to search users...</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Message Body *</label>
                                        <textarea class="form-control" id="messageBody" rows="4" required
                                            maxlength="500" placeholder="Enter your message here..."></textarea>
                                        <small class="text-muted"><span id="bodyCount">0</span>/500 characters</small>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Event (Optional)</label>
                                            <select class="form-select" id="eventId">
                                                <option value="">Select Tournament</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Match Time (Optional)</label>
                                            <input type="datetime-local" class="form-control" id="matchTime">
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Room ID (Optional)</label>
                                            <input type="text" class="form-control" id="roomId"
                                                placeholder="e.g., 12345678">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Room Password (Optional)</label>
                                            <input type="text" class="form-control" id="roomPassword"
                                                placeholder="e.g., pass123">
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary btn-lg w-100">
                                        <i class="fas fa-paper-plane"></i> Send Message
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- History Tab -->
                    <div class="tab-pane fade" id="history">
                        <div class="card">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">📋 Sent Messages</h5>
                                <div>
                                    <input type="text" id="searchHistory"
                                        class="form-control form-control-sm d-inline-block" style="width: 200px;"
                                        placeholder="Search messages...">
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Title</th>
                                                <th>Recipient</th>
                                                <th>Event</th>
                                                <th>Sent At</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="historyTableBody">
                                            <tr>
                                                <td colspan="6" class="text-center py-4">
                                                    <div class="spinner-border text-primary" role="status"></div>
                                                    <p class="mt-2 text-muted">Loading messages...</p>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Detail Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">📬 Message Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="messageDetails">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://139.59.1.29:5000';
        let adminToken = localStorage.getItem('admin_token');
        let adminData = JSON.parse(localStorage.getItem('admin_data') || '{}');
        let userSearchTimeout = null;

        // Check if logged in
        if (!adminToken) {
            window.location.href = 'login.html';
        }

        // Display admin info
        document.getElementById('adminName').textContent = adminData.username || 'Admin';
        document.getElementById('adminRole').textContent = adminData.admin_role === 'super' ? 'Super Admin' : 'Secondary Admin';

        // Hide super admin only features
        if (adminData.admin_role !== 'super') {
            document.getElementById('adminsLink').style.display = 'none';
        }

        // Logout
        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_data');
            window.location.href = 'login.html';
        }

        // Character count
        document.getElementById('messageBody').addEventListener('input', () => {
            const count = document.getElementById('messageBody').value.length;
            document.getElementById('bodyCount').textContent = count;
        });

        // Send To toggle
        document.getElementById('sendTo').addEventListener('change', function () {
            const userSelectDiv = document.getElementById('userSelectDiv');
            userSelectDiv.style.display = this.value === 'specific' ? 'block' : 'none';
        });

        // User search
        document.getElementById('userSearch').addEventListener('input', function () {
            clearTimeout(userSearchTimeout);
            const query = this.value.trim();

            if (query.length < 2) {
                document.getElementById('userId').innerHTML = '<option value="">Type at least 2 characters...</option>';
                return;
            }

            userSearchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`${API_URL}/admin/users?search=${query}&limit=20`, {
                        headers: { 'Authorization': `Bearer ${adminToken}` }
                    });
                    const data = await response.json();

                    if (data.success && data.data.length > 0) {
                        const options = data.data.map(u =>
                            `<option value="${u.user_id}">#${u.user_id} - ${u.username} (${u.full_name || 'No name'})</option>`
                        ).join('');
                        document.getElementById('userId').innerHTML = options;
                    } else {
                        document.getElementById('userId').innerHTML = '<option value="">No users found</option>';
                    }
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById('userId').innerHTML = '<option value="">Error searching users</option>';
                }
            }, 300);
        });

        // Load tournaments for event dropdown
        async function loadTournaments() {
            try {
                const response = await fetch(`${API_URL}/admin/tournaments?limit=100`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const data = await response.json();

                if (data.success) {
                    const select = document.getElementById('eventId');
                    const options = data.data.map(t =>
                        `<option value="${t.tournament_id}">${t.tournament_name} - ${new Date(t.tournament_start_time).toLocaleDateString()}</option>`
                    ).join('');
                    select.innerHTML = '<option value="">Select Tournament</option>' + options;
                }
            } catch (error) {
                console.error('Error loading tournaments:', error);
            }
        }

        // Compose form submit
        document.getElementById('composeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const sendTo = document.getElementById('sendTo').value;
            const userId = document.getElementById('userId').value;

            if (sendTo === 'specific' && !userId) {
                alert('Please select a user');
                return;
            }

            const formData = {
                title: document.getElementById('messageTitle').value,
                message: document.getElementById('messageBody').value,
                user_id: sendTo === 'specific' ? parseInt(userId) : null,
                event_id: document.getElementById('eventId').value || null,
                room_id: document.getElementById('roomId').value || null,
                room_password: document.getElementById('roomPassword').value || null,
                match_time: document.getElementById('matchTime').value || null,
                is_broadcast: sendTo === 'all'
            };

            if (!confirm(`Send message to ${sendTo === 'all' ? 'ALL USERS' : 'selected user'}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/inbox/send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    alert('Message sent successfully!');
                    document.getElementById('composeForm').reset();
                    document.getElementById('bodyCount').textContent = '0';
                    loadHistory();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to send message');
            }
        });

        // Load message history
        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/admin/inbox/messages`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                const data = await response.json();
                const tbody = document.getElementById('historyTableBody');

                if (data.success && data.data.length > 0) {
                    tbody.innerHTML = data.data.map(msg => `
                        <tr>
                            <td>#${msg.message_id}</td>
                            <td><strong>${msg.title}</strong></td>
                            <td>${msg.is_broadcast ? '<span class="badge bg-primary">All Users</span>' : `<span class="badge bg-info">${msg.username || 'User #' + msg.user_id}</span>`}</td>
                            <td>${msg.tournament_name ? `<small>${msg.tournament_name}</small>` : '-'}</td>
                            <td>${new Date(msg.created_at).toLocaleString()}</td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick="viewMessage(${msg.message_id})">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteMessage(${msg.message_id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No messages sent yet</td></tr>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('historyTableBody').innerHTML =
                    '<tr><td colspan="6" class="text-center py-4 text-danger">Error loading messages</td></tr>';
            }
        }

        // View message details
        async function viewMessage(messageId) {
            const modal = new bootstrap.Modal(document.getElementById('messageModal'));
            modal.show();

            try {
                const response = await fetch(`${API_URL}/admin/inbox/messages`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                const data = await response.json();
                const message = data.data.find(m => m.message_id === messageId);

                if (message) {
                    document.getElementById('messageDetails').innerHTML = `
                        <div class="row">
                            <div class="col-12 mb-3">
                                <h6>Title:</h6>
                                <p>${message.title}</p>
                            </div>
                            <div class="col-12 mb-3">
                                <h6>Message:</h6>
                                <p>${message.message}</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <h6>Recipient:</h6>
                                <p>${message.is_broadcast ? 'All Users (Broadcast)' : message.username || 'User #' + message.user_id}</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <h6>Sent At:</h6>
                                <p>${new Date(message.created_at).toLocaleString()}</p>
                            </div>
                            ${message.tournament_name ? `
                                <div class="col-md-6 mb-3">
                                    <h6>Event:</h6>
                                    <p>${message.tournament_name}</p>
                                </div>
                            ` : ''}
                            ${message.room_id ? `
                                <div class="col-md-6 mb-3">
                                    <h6>Room ID:</h6>
                                    <p>${message.room_id}</p>
                                </div>
                            ` : ''}
                            ${message.room_password ? `
                                <div class="col-md-6 mb-3">
                                    <h6>Room Password:</h6>
                                    <p>${message.room_password}</p>
                                </div>
                            ` : ''}
                            ${message.match_time ? `
                                <div class="col-md-6 mb-3">
                                    <h6>Match Time:</h6>
                                    <p>${new Date(message.match_time).toLocaleString()}</p>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('messageDetails').innerHTML =
                    '<div class="alert alert-danger">Error loading message details</div>';
            }
        }

        // Delete message
        async function deleteMessage(messageId) {
            if (!confirm('Are you sure you want to delete this message?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/inbox/${messageId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                const data = await response.json();

                if (data.success) {
                    alert('Message deleted successfully');
                    loadHistory();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete message');
            }
        }

        // Search history
        document.getElementById('searchHistory').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const rows = document.querySelectorAll('#historyTableBody tr');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        });

        // Initialize
        loadTournaments();
        loadHistory();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
